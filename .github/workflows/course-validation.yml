name: Course path validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [starter, list, detail]
    env:
      CONTENT_SOURCE: sample
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node course/apply-stage.mjs ${{ matrix.stage }}
      - run: npm run check
      - run: npm run test:course
